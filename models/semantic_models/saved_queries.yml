version: 2

saved_queries:
  - name: status_revenue_report
    query_params:
      metrics:
        - total_revenue
      group_by:
        - Dimension('orders__order_status')
        - TimeDimension('metric_time__day')
# Exports sits parallel to query_params
    config:
      cache:
        enabled: true
    exports:
      - name: status_revenue_cache
        config:
          export_as: table      # Required parameter for export targets