version: 2

semantic_models:
  - name: orders_source
    description: "The core semantic model for tracking customer orders, payments, and fulfillment."
    model: ref('fct_orders')
    defaults:
      agg_time_dimension: metric_time

    entities:
      - name: orders
        type: primary
        expr: order_id

    dimensions:
      - name: metric_time
        type: time
        type_params:
          time_granularity: day
        expr: ordered_at  
      - name: order_status
        type: categorical
        expr: status_code

    measures:
      - name: order_total_amount
        description: "The total gross value of orders before discounts."
        expr: order_amount
        agg: sum
      - name: order_count
        description: "Distinct count of successfully placed orders."
        expr: order_id
        agg: count_distinct


metrics:
  - name: total_revenue
    description: "Total company revenue generated from order transactions."
    label: "Total Revenue Testing"
    type: simple
    type_params:
      measure: order_total_amount # <-- Changed from 'measure' to 'input_measure'

  - name: total_orders
    description: "Total orders"
    label: "Total orders"
    type: simple
    type_params:
      measure: order_count # <-- Changed from 'measure' to 'input_measure'      
