# models/semantic_models/metricflow_time_spine.yml
version: 2

semantic_models:
  - name: metricflow_time_spine
    model: ref('metricflow_time_spine') # Points to your daily date table
    defaults:
      agg_time_dimension: date_day

    entities:
          - name: spine_date
            type: primary

    measures: []

    dimensions:
      - name: date_day
        type: time
        type_params:
          time_granularity: day # <--- Define ONLY the lowest grain here